x-spark-image: &spark-image
  build:
    context: .
    dockerfile: Dockerfile
  image: spark-custom:latest

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_MESSAGE_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:-10485760}
      KAFKA_REPLICA_FETCH_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:-10485760}
      KAFKA_SOCKET_REQUEST_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:-10485760}
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs
    command: server -dir=/data -ip=seaweedfs -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # Master UI
      - "8888:8888"   # Filer UI (browse buckets at /buckets/)
    volumes:
      - seaweedfs-data:/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://seaweedfs:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Creating an existing bucket only prints an error, so the init step stays idempotent
    command:
      - echo "s3.bucket.create -name ${S3_BUCKET:-lakehouse}" | weed shell -master=seaweedfs:9333
    networks:
      - platform-network
    restart: "no"

  spark-master:
    <<: *spark-image
    container_name: spark-master
    #command: /opt/spark/sbin/start-master.sh
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      #SPARK_MASTER_OPTS: "-Dspark.cores.max=4"
      SPARK_MASTER_OPTS: "-Dspark.cores.max=4 -Dspark.executor.instances=2 -Dspark.executor.cores=2"
    ports:
      - "7077:7077"
      - "8080:8080"
      #- "4040:4040"
    volumes:
      - ./scripts:/opt/infra/scripts:ro
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s      

  spark-connect:
    <<: *spark-image
    container_name: spark-connect
    depends_on:
      spark-master:
        condition: service_healthy
    # --wait keeps the Connect server in the foreground so the container stays alive
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --wait
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-connect
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf
      - spark.dynamicAllocation.enabled=false
      - --conf
      - spark.executor.instances=2
      - --conf
      - spark.executor.cores=2
      - --conf
      - spark.cores.max=4
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
    ports:
      - "15002:15002"
      - "4040:4040"
    volumes:
      - ${SPARK_DATA_DIR:-./data}:/opt/spark/data
    networks:
      - platform-network


  spark-worker:
    <<: *spark-image
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-4g}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-lakehouse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
    volumes:
      - ${SPARK_DATA_DIR:-./data}:/opt/spark/data
      - ./scripts:/opt/infra/scripts:ro
    networks:
      - platform-network

networks:
  platform-network:
    name: platform-network
    driver: bridge

volumes:
  kafka-data:
  seaweedfs-data:
